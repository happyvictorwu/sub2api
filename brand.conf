# ============================================================================
#  品牌单一真源 (Single Source of Truth)
# ============================================================================
#  改这一个文件，然后跑：  ./tools/rebrand.sh
#
#  重新 fork 上游之后的完整流程只有三步：
#    1. cp <旧仓库>/brand.conf .
#    2. cp -r <旧仓库>/tools/rebrand.sh scripts/
#    3. ./tools/rebrand.sh
#
#  这个文件会被三方读取：
#    - tools/rebrand.sh   （bash source）
#    - frontend/vite.config.ts （构建期注入 import.meta.env.VITE_BRAND_*）
#    - docker-compose        （可用 env_file 引入，后端运行时读同名环境变量）
#
#  格式要求：KEY=value，等号两边不留空格，值含空格时用双引号。
# ============================================================================

# ---- 必填 ------------------------------------------------------------------

# 产品名。出现在页面标题、邮件、订单名、2FA 发行方、合规声明等所有用户可见处。
BRAND_NAME=Slothwatching

# 小写标识符。用于 docker 镜像名、数据库名、redis key 前缀、日志服务名、
# systemd 服务名、包名等。只允许 [a-z0-9-]，且不能包含 "sub2api"。
BRAND_SLUG=slothwatching

# 环境变量前缀（大写）。上游用 SUB2API_ 开头的内部变量会重命名成这个。
BRAND_ENV_PREFIX=SLOTHWATCHING

# ---- 选填（留空则自动派生，派生值一律用 RFC 保留的 example.com 占位）--------

# 主域名。留空 → ${BRAND_SLUG}.example.com
BRAND_DOMAIN=

# 客服/联系邮箱。留空 → support@${BRAND_DOMAIN}
BRAND_SUPPORT_EMAIL=

# 你的 GitHub 仓库（owner/repo）。文档里指向上游的链接会改指到这里。
# 注意：Go module path 不受此项影响，见 REBRAND.md「为什么不改 module path」。
BRAND_GITHUB_REPO=happyvictorwu/sub2api

# 副标题。用于 HTML <title> 的 "品牌名 - 副标题"。
BRAND_TAGLINE="AI API Gateway"

# Docker 镜像名。上游的 weishaw/sub2api 会改成这个。
# 留空 → ${BRAND_SLUG}
BRAND_DOCKER_IMAGE=

# ---- 脚本行为开关 ----------------------------------------------------------

# 是否重命名带品牌的文件/目录（deploy/sub2api.service、skills/sub2api-admin/ 等）。
# 默认 0：路径重命名是 git merge 冲突的最大来源，而你选择了保留 module path
# 以维持可合并性，改路径会抵消掉这个好处。确定要改再设 1。
BRAND_RENAME_PATHS=0

# 是否重写 README.md / README_CN.md / README_JA.md。
# 默认 1：脚本已保护赞助商推广码（aff=SUB2API 等），不会破坏链接。
# 设 0 则完全不碰 README，你自己另写一份。
BRAND_REWRITE_READMES=1
