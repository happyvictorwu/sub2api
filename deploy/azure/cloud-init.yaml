#cloud-config
# =============================================================================
# Slothwatching Azure VM 初始化
# 安装 Docker Engine + Compose 插件，准备部署目录，并做一些基础加固
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - unattended-upgrades

write_files:
  - path: /etc/sysctl.d/99-slothwatching.conf
    content: |
      net.core.somaxconn = 65535
      net.ipv4.tcp_max_syn_backlog = 8192
      fs.file-max = 200000
      vm.overcommit_memory = 1
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "live-restore": true
      }

runcmd:
  # ---------------------------------------------------------------------------
  # Docker 官方源
  # ---------------------------------------------------------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # ---------------------------------------------------------------------------
  # 让首个普通用户（Azure adminUsername，uid 1000）可以直接用 docker
  # ---------------------------------------------------------------------------
  - 'APP_USER=$(getent passwd 1000 | cut -d: -f1); usermod -aG docker "$APP_USER"'
  - 'APP_USER=$(getent passwd 1000 | cut -d: -f1); install -d -o "$APP_USER" -g "$APP_USER" -m 0755 /opt/slothwatching'

  # ---------------------------------------------------------------------------
  # 2G swap：B 系列内存偏小，构建/迁移期间兜底
  # ---------------------------------------------------------------------------
  - test -f /swapfile || (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab)

  # ---------------------------------------------------------------------------
  # 内核参数 + 自动安全更新
  # ---------------------------------------------------------------------------
  - sysctl --system
  - systemctl enable --now unattended-upgrades

  # 标记初始化完成，GitHub Actions 部署脚本会检查这个文件
  - touch /opt/slothwatching/.cloud-init-done

final_message: "Slothwatching VM ready after $UPTIME seconds"
